<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sisyphus 代码关系索引</title>
<style>
:root{--bg:#1e1e1e;--fg:#d4d4d4;--dim:#808080;--accent:#569cd6;--border:#333;--card:#252526}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,PingFang SC,Microsoft YaHei,sans-serif;padding:16px;max-width:900px;margin:0 auto;font-size:13px;line-height:1.5}
h1{font-size:1rem;color:var(--accent);margin-bottom:4px}
.stats{display:flex;gap:8px;margin:10px 0 16px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:3px 8px;font-size:.7rem}
.stat b{color:var(--accent)}
.search{width:100%;padding:7px 10px;background:var(--card);border:1px solid var(--border);border-radius:4px;color:var(--fg);font-size:.78rem;margin-bottom:14px;outline:none}
.search:focus{border-color:var(--accent)}
.file{border-left:2px solid var(--border);padding:4px 0 4px 12px;margin-bottom:6px;margin-left:6px;font-size:.75rem}
.file:hover{border-color:rgba(86,156,214,.25)}
.file-name{color:#9cdcfe;font-weight:500}
.file-meta{color:var(--dim);font-size:.65rem;margin-left:6px}
.file-imports{color:#6a9955;font-size:.65rem;margin-left:8px}
.arrow{color:var(--dim)}
.dir{margin-bottom:16px}
.dir h2{font-size:.85rem;color:var(--accent);border-bottom:1px solid rgba(86,156,214,.12);padding-bottom:2px;margin-bottom:6px}
.no-results{color:var(--dim);text-align:center;padding:20px}
</style></head><body>
<h1>Sisyphus 代码关系索引</h1>
<div class="stats">
<div class="stat">模块 <b>0</b></div>
<div class="stat">函数 <b>305</b></div>
<div class="stat">类 <b>42</b></div>
<div class="stat">调用边 <b>1758</b></div>
</div>
<input class="search" placeholder="搜索文件或关系..." oninput="filter(this.value)">
<script>
function filter(q){
 q=q.toLowerCase();
 var vis=0;
 document.querySelectorAll('.file').forEach(function(f){
  var m=f.textContent.toLowerCase().includes(q);
  f.style.display=m?'':'none';
  if(m)vis++;
 });
 var nr=document.querySelector('.no-results');
 if(vis===0&&!nr){nr=document.createElement('div');nr.className='no-results';nr.textContent='无匹配';document.body.appendChild(nr)}
 if(vis>0&&nr)nr.remove();
}
</script>

</body></html>
