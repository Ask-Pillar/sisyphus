[project]
name = "sisyphus"
version = "0.1.0"
description = "Self-evolving AI agent with persistent memory"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
sisyphus-memory = "sisyphus.memory.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["sisyphus"]
